name: android-crdt

on:
  pull_request:
    paths:
      - mobile/**
      - Makefile
      - go.mod
      - go.sum
      - .github/workflows/android-crdt.yml
  push:
    branches: [main]
    paths:
      - mobile/**
      - Makefile
      - go.mod
      - go.sum
      - .github/workflows/android-crdt.yml

jobs:
  aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
        env:
          ANDROID_NDK_VERSION: 29.0.14206865 # keep in step with the Makefile
      - run: make android-crdt
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
      - uses: actions/upload-artifact@v4
        with:
          name: yana-crdt-aar
          path: android/crdt/libs/yana-crdt.aar
          if-no-files-found: error
